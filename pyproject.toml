[project]
name = "answer-with-web"
version = "0.1.0"
description = "Answer questions using web search + retrieval + a local LLM"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch",
    "langchain>=1.0",
    "langchain-ollama>=0.1.0",
    "langchain-text-splitters>=0.0.1",
    "sentence-transformers>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "crawl4ai>=0.2.0",
    "strip-markdown>=0.1.4",
    "googlesearch-python>=1.2.3",
    "fake-http-header",
    "ddgs>=9.16.0",
    "stealth-requests>=2.0.6",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
